#Christmas Mailbox lighting.
[mailboxLights]
	#Mailboxes emit light at all. False removes all light cost.
	emitLight = true
	#Pulse between low and high light. False keeps the high level.
	pulseEnabled = true
	#Full on/off cycle length in ticks (20 ticks = 1 second).
	# Default: 40
	# Range: 10 ~ 400
	pulsePeriodTicks = 40
	#Bright level, or the constant level when pulsing is off.
	# Default: 6
	# Range: 0 ~ 15
	highLightLevel = 6
	#Dim level during the pulse. Values above highLightLevel are treated as highLightLevel.
	# Default: 2
	# Range: 0 ~ 15
	lowLightLevel = 2
	#Global budget of mailbox light changes per server tick.
	# Default: 8
	# Range: 1 ~ 64
	maxPulseChangesPerTick = 8
	#Only pulse when a living player is within this many blocks.
	# Default: 48
	# Range: 8 ~ 128
	pulsePlayerRange = 48

#Letters.
[letters]
	#Maximum characters in a letter body.
	# Default: 500
	# Range: 50 ~ 2000
	maxLength = 500
	#Minimum ticks between two sealed letters from the same player (anti-spam).
	# Default: 20
	# Range: 0 ~ 200
	sealCooldownTicks = 20

#Mail between players.
[mail]
	#Maximum items waiting in one player's inbox. Sending to a full inbox is refused.
	# Default: 200
	# Range: 10 ~ 5000
	maxInbox = 200
	#Tell an online recipient in chat that new mail arrived.
	notifyRecipients = false
	#How many players the recipient list shows (most recently seen first).
	# Default: 2000
	# Range: 50 ~ 20000
	recipientListLimit = 2000

#Santa Claus.
[santa]
	#Accept letters to Santa. Already accepted letters are still answered.
	enabled = true
	#Tell an online player in chat when Santa's reply arrives.
	notifyOnReply = true

#Christmas outfits.
[outfits]
	#A full Santa outfit (4 pieces, iron or diamond, mixed is fine) gives Resistance I and
	#Regeneration I while worn. The +12.5% speed per piece always applies.
	santaSetEffects = true

#Decorations.
[decorations]
	#Chance that an empty Christmas Stocking fills up with a small gift once per in-game
	#day, after sunrise (0 = never, 1 = every day). Right-click a full stocking to take the gift.
	#The gifts come from the loot table christmas_hearthlight:gameplay/stocking_gift (data pack).
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	stockingGiftChance = 0.1

#Winter weather (Overworld).
[weather]
	#Snow falls wherever rain would fall. Dry biomes (desert, savanna, badlands) stay dry.
	snowInsteadOfRain = true
	#Let the mod schedule frequent short snowfalls within the budget below.
	#False leaves weather timing to vanilla (the budget still caps it).
	frequentSnow = true
	#Maximum precipitation ticks inside the rolling window. 24000 = one Minecraft day.
	# Default: 24000
	# Range: 0 ~ 72000
	budgetTicks = 24000
	#Rolling window length in ticks. 72000 = three Minecraft days.
	# Default: 72000
	# Range: 24000 ~ 240000
	windowTicks = 72000
	#Shortest snowfall.
	# Default: 3000
	# Range: 600 ~ 24000
	minSnowTicks = 3000
	#Longest snowfall.
	# Default: 9000
	# Range: 600 ~ 24000
	maxSnowTicks = 9000
	#Shortest clear spell between snowfalls.
	# Default: 4000
	# Range: 600 ~ 48000
	minClearTicks = 4000
	#Longest clear spell between snowfalls.
	# Default: 14000
	# Range: 600 ~ 72000
	maxClearTicks = 14000

#World generation.
[worldgen]
	#Place exactly one Christmas Mailbox in every newly generated vanilla village.
	#Villages that already exist are never changed.
	villageMailboxes = true
